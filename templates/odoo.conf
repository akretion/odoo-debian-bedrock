[options]
; odoo-debian-bedrock hardened config. Managed by scripts/40-oca-venv.sh.
admin_passwd = @ADMIN_PASSWD@
db_host = False
db_port = False
db_user = odoo
db_password = False
dbfilter = ^%d$
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
list_db = True
; Instance ports. nginx upstreams must match (50-nginx.sh renders
; ${ODOO_PORT:-8069} / ${LONGPOLLING_PORT:-8072} into the vhost).
http_port = @HTTP_PORT@
gevent_port = @LONGPOLLING_PORT@
; nginx is the only entry point (127.0.0.1); override with HTTP_INTERFACE=0.0.0.0
; when a container or another host must reach Odoo directly.
http_interface = @HTTP_INTERFACE@
; venv site-packages FIRST (OCA addons), deb core second.
addons_path = @VENV_ADDONS@,/usr/lib/python3/dist-packages/odoo/addons
