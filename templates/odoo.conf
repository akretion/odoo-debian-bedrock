[options]
; odoo-debian-bedrock hardened config. Managed by scripts/40-oca-venv.sh.
admin_passwd = @ADMIN_PASSWD@
db_host = False
db_port = False
db_user = odoo
db_password = False
dbfilter = ^%d$
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
list_db = True
; venv site-packages FIRST (OCA addons), deb core second.
addons_path = @VENV_ADDONS@,/usr/lib/python3/dist-packages/odoo/addons
