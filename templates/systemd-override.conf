# Drop-in: run Odoo through the bedrock venv + hardening.
# Installed at /etc/systemd/system/odoo.service.d/akretion.conf
[Service]
ExecStart=
ExecStart=@VENV@/bin/python3 /usr/bin/odoo --config /etc/odoo/odoo.conf --logfile /var/log/odoo/odoo-server.log
ProtectSystem=full
NoNewPrivileges=true
PrivateTmp=true
Restart=on-failure
RestartSec=5
