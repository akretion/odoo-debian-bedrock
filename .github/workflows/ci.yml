name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (advisory for now)
        run: |
          sudo apt-get install -y shellcheck > /dev/null
          shellcheck -S warning bin/bedrock install.sh scripts/*.sh

  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every README "OK" cell (trixie+16/17 are "??" untested).
        include:
          - { name: "debian12-16", image: debian:12,  odoo: "16.0" }
          - { name: "debian12-17", image: debian:12,  odoo: "17.0" }
          - { name: "debian12-18", image: debian:12,  odoo: "18.0" }
          - { name: "debian13-18", image: debian:13,  odoo: "18.0" }
          - { name: "debian13-19", image: debian:13,  odoo: "19.0" }
          - { name: "jammy-16",    image: ubuntu:22.04, odoo: "16.0" }
          - { name: "jammy-17",    image: ubuntu:22.04, odoo: "17.0" }
          - { name: "jammy-18",    image: ubuntu:22.04, odoo: "18.0" }
          - { name: "noble-16",    image: ubuntu:24.04, odoo: "16.0" }
          - { name: "noble-17",    image: ubuntu:24.04, odoo: "17.0" }
          - { name: "noble-18",    image: ubuntu:24.04, odoo: "18.0" }
          - { name: "noble-19",    image: ubuntu:24.04, odoo: "19.0" }
    name: install (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      # checkout needs git inside the container; install first
      - name: bootstrap git/curl
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -sf /usr/share/zoneinfo/Etc/UTC /etc/localtime 2>/dev/null || true
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates

      - uses: actions/checkout@v4

      - name: bedrock 10-base
        run: bash scripts/10-base.sh

      - name: bedrock 20-postgres
        run: bash scripts/20-postgres.sh

      - name: bedrock 30-odoo-deb
        run: bash scripts/30-odoo-deb.sh
        env:
          ODOO_VERSION: ${{ matrix.odoo }}

      - name: bedrock 40-oca-venv
        run: bash scripts/40-oca-venv.sh
        env:
          ODOO_VERSION: ${{ matrix.odoo }}
          ODOO_ADMIN_PASSWD: ci-admin
          OCA_ADDONS: odoo-addon-mis_builder odoo-addon-web_responsive

      - name: start postgres (no systemd in containers)
        run: |
          service postgresql start 2>/dev/null || \
            pg_ctlcluster "$(ls /etc/postgresql | head -1)" main start
          su -s /bin/bash postgres -c \
            "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='odoo'\" | grep -q 1 || createuser -d -R -S odoo"
          pg_lsclusters

      - name: smoke test — install mis_builder + web_responsive on a fresh db
        run: |
          su -s /bin/bash odoo -c "\
            /usr/lib/odoo/venv/bin/python3 /usr/bin/odoo \
              -c /etc/odoo/odoo.conf -d ci_test \
              -i mis_builder,web_responsive --stop-after-init --without-demo=all" 2>&1 | tee /tmp/smoke.log
          grep -q "Module mis_builder loaded" /tmp/smoke.log
          grep -q "Module web_responsive loaded" /tmp/smoke.log
          ! grep -E " ERROR |CRITICAL" /tmp/smoke.log

      - name: smoke test — HTTP serves
        run: |
          su -s /bin/bash odoo -c "\
            /usr/lib/odoo/venv/bin/python3 /usr/bin/odoo \
              -c /etc/odoo/odoo.conf > /tmp/http.log 2>&1 &"
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8069/web/login || true)
            [ "$code" = "200" ] || [ "$code" = "303" ] && break
          done
          echo "HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "303" ]

      - name: smoke test — nginx reverse proxy (port 80)
        env:
          ODOO_VERSION: ${{ matrix.odoo }}
        run: |
          # odoo (started fresh — a bg process doesn't survive across steps)
          su -s /bin/bash odoo -c "\
            /usr/lib/odoo/venv/bin/python3 /usr/bin/odoo \
              -c /etc/odoo/odoo.conf > /tmp/http2.log 2>&1 &"
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8069/web/login || true)
            [ "$code" = "200" ] || [ "$code" = "303" ] && break
          done
          # nginx vhost with a fake hostname (server_name odoo.test)
          DOMAIN=odoo.test bash scripts/50-nginx.sh
          # nginx should proxy :80 -> :8069; fake the Host header
          for i in $(seq 1 15); do
            sleep 2
            code80=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: odoo.test" http://127.0.0.1/web/login || true)
            [ "$code80" = "200" ] || [ "$code80" = "302" ] || [ "$code80" = "303" ] && break
          done
          echo "nginx HTTP $code80"
          [ "$code80" = "200" ] || [ "$code80" = "302" ] || [ "$code80" = "303" ]

      - name: smoke test — staging instance (81-staging.sh)
        if: matrix.name == 'noble-18'
        env:
          ODOO_VERSION: ${{ matrix.odoo }}
        run: |
          # minimal fixture project (a local git repo app-staging can clone)
          # NOTE: container steps run under `sh` (dash) — no brace expansion.
          rm -rf /tmp/fixproj
          mkdir -p /tmp/fixproj/odoo/links /tmp/fixproj/odoo/local-src /tmp/fixproj/odoo/external-src/server-tools
          touch /tmp/fixproj/odoo/links/.keep /tmp/fixproj/odoo/local-src/.keep /tmp/fixproj/odoo/external-src/server-tools/.keep
          cd /tmp/fixproj && git init -q && git -c user.email=ci@ci -c user.name=ci add -A && git -c user.email=ci@ci -c user.name=ci commit -qm init
          PROJECT_NAME=fixproj PROJECT_REPO=/tmp/fixproj PROJECT_BRANCH= bash scripts/81-staging.sh
          # assert the instance artifacts
          id app-staging > /dev/null && id odoo-staging > /dev/null
          [ -x /usr/lib/odoo/venv-staging/bin/python3 ]
          grep -q "db_user = odoo-staging" /etc/odoo/odoo-staging.conf
          grep -q "http_port = 8070" /etc/odoo/odoo-staging.conf
          grep -q "dbfilter = ^fixproj_staging" /etc/odoo/odoo-staging.conf
          [ -f /etc/systemd/system/odoo-staging.service ]
          # boot staging odoo on the alternate port and check it serves
          su -s /bin/bash odoo-staging -c "/usr/lib/odoo/venv-staging/bin/python3 /usr/bin/odoo -c /etc/odoo/odoo-staging.conf > /tmp/staging.log 2>&1 &"
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8070/web/login || true)
            [ "$code" = "200" ] || [ "$code" = "303" ] && break
          done
          echo "staging HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "303" ]

  # Akretion's own tooling must stay installable on every distro we
  # support, independent of the Odoo install tests. docky (PyPI) + ak (git).
  tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, debian:13, ubuntu:22.04, ubuntu:24.04]
    name: tools (${{ matrix.image }})
    container: ${{ matrix.image }}
    steps:
      - name: bootstrap git/curl + pipx
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -sf /usr/share/zoneinfo/Etc/UTC /etc/localtime 2>/dev/null || true
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates pipx

      - name: install docky + ak
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install docky --include-deps
          pipx install git+https://github.com/akretion/ak --force --include-deps

      - name: smoke test — CLI entry points
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          docky --help > /dev/null
          ak --help > /dev/null
          echo "docky and ak OK"
